[project]
name = "peoplelake"
version = "0.1.0"
description = "PeopleLake pipelines: synthetic sources, Iceberg lake, warehouse loader, dbt runner, evals and production bootstrap"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-core==1.12.5",
  "dbt-duckdb==1.11.0",
  "dbt-bigquery==1.12.1",
  "duckdb==1.5.6",
  "pyarrow==26.0.0",
  "pyiceberg[sql-sqlite,pyarrow]==0.12.0",
  "google-cloud-bigquery==3.46.1",
  "google-cloud-datacatalog==3.32.0",
  "google-cloud-bigquery-datapolicies==0.10.1",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "pydantic==2.14.0",
]

[project.scripts]
peoplelake = "peoplelake.cli:main"

[dependency-groups]
dev = [
  "dbt-metricflow==0.15.0",
  "metricflow==0.213.0",
  "pytest==9.1.1",
  "ruff==0.17.0",
  "sqlglot==30.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peoplelake"]

[tool.uv]
required-version = ">=0.12.17,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: end to end tests that start the local stack",
  "smoke: fast checks run by the clean clone job",
  "dbt: tests that drive dbt in process",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["peoplelake", "sourceview", "conftest"]
