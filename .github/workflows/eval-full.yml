name: eval-full

# Full profile (100,000 events) scenario equivalence on DuckDB, on demand and weekly. Never on push.
# Results are uploaded as artifacts and never committed by CI.
on:
  workflow_dispatch:
    inputs:
      freshness_minutes:
        description: "Also run the local freshness eval for this many minutes (1 to 60, 0 to skip; reports only)"
        required: false
        default: "20"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --locked --project pipeline
      - run: uv run --project pipeline peoplelake dev reference-digests --profile full --out reference-digests-full.json
      - uses: actions/upload-artifact@v7
        with:
          name: reference-digests-full
          path: reference-digests-full.json

  scenarios:
    needs: [reference]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [B, S1, S2, S3, S4, S5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --locked --project pipeline
      - uses: actions/download-artifact@v7
        with:
          name: reference-digests-full
      - run: uv run --project pipeline peoplelake auth dev-keys
      - name: Scenario ${{ matrix.scenario }} on the full profile
        # Twice the slowest full-profile scenario measured locally (S4, 161.0 s in
        # evals/results/scenarios-full-duckdb-2026-10-11.json) times the small profile's larger measured
        # slowdown on this runner (1.5), rounded up; eval-full has not run on GitHub yet (see README CI).
        timeout-minutes: 9
        run: >
          uv run --project pipeline peoplelake eval scenarios --profile full --chunks 20
          --scenarios ${{ matrix.scenario }} --reference reference-digests-full.json
          --out results/scenario-full-${{ matrix.scenario }}.json
      - if: always()
        run: uv run --project pipeline peoplelake stack down
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-full-${{ matrix.scenario }}
          path: results/
          if-no-files-found: ignore

  freshness:
    # The optional local freshness run (SPEC 16.2, 17): the full profile through the local stack for
    # freshness_minutes (default 20, also on the weekly schedule; 0 skips it). Reports only.
    if: ${{ (inputs.freshness_minutes || '20') != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --locked --project pipeline
      - run: uv run --project pipeline peoplelake auth dev-keys
      - name: Local freshness on the full profile
        # Twice the wall time of a 60-minute local run (61 min 7 s, wall_time_s in
        # evals/results/freshness-local-full-prod-guards-2026-10-11.json), the longest the input allows.
        timeout-minutes: 122
        env:
          FRESHNESS_MINUTES: ${{ inputs.freshness_minutes || '20' }}
        run: |
          if ! [[ "$FRESHNESS_MINUTES" =~ ^[0-9]+$ ]] || [ "$FRESHNESS_MINUTES" -lt 1 ] || [ "$FRESHNESS_MINUTES" -gt 60 ]; then
            echo "freshness_minutes must be 0 (skip) or 1 to 60, got: $FRESHNESS_MINUTES" >&2
            exit 2
          fi
          uv run --project pipeline peoplelake eval freshness --target local --duration "${FRESHNESS_MINUTES}m" \
            --out results/freshness-local-full.json
      - if: always()
        run: uv run --project pipeline peoplelake stack down
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshness-local-full
          path: |
            results/
            .data/eval/freshness/logs/
          if-no-files-found: ignore
