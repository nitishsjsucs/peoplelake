name: eval-full

# Full profile (100,000 events) scenario equivalence on DuckDB, on demand and weekly. Never on push.
# Results are uploaded as artifacts and never committed by CI.
on:
  workflow_dispatch:
    inputs:
      freshness_minutes:
        description: "Also run the local freshness eval for this many minutes (0 to skip; reports only)"
        required: false
        default: "20"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --locked --project pipeline
      - run: uv run --project pipeline peoplelake dev reference-digests --profile full --out reference-digests-full.json
      - uses: actions/upload-artifact@v7
        with:
          name: reference-digests-full
          path: reference-digests-full.json

  scenarios:
    needs: [reference]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [B, S1, S2, S3, S4, S5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --locked --project pipeline
      - uses: actions/download-artifact@v7
        with:
          name: reference-digests-full
      - run: uv run --project pipeline peoplelake auth dev-keys
      - name: Scenario ${{ matrix.scenario }} on the full profile
        # Twice the slowest full-profile scenario measured locally (S4, 147 s) times the small profile's
        # measured slowdown on this runner (1.5); eval-full has not run on GitHub yet (see README CI).
        timeout-minutes: 8
        run: >
          uv run --project pipeline peoplelake eval scenarios --profile full --chunks 20
          --scenarios ${{ matrix.scenario }} --reference reference-digests-full.json
          --out results/scenario-full-${{ matrix.scenario }}.json
      - if: always()
        run: uv run --project pipeline peoplelake stack down
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-full-${{ matrix.scenario }}
          path: results/
          if-no-files-found: ignore
